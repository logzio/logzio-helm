mits|container_memory_usage_bytes|container_network_transmit_packets_total|container_network_receive_packets_total|container_network_transmit_packets_dropped_total|container_network_receive_packets_dropped_total|kube_pod_created|kube_pod_owner|kube_pod_status_reason|node_cpu_seconds_total|node_memory_MemAvailable_bytes|kube_node_role|kube_node_created|node_load1|node_load5|node_load15|node_disk_reads_completed_total|node_disk_writes_completed_total|node_disk_read_bytes_total|node_disk_written_bytes_total|node_disk_read_time_seconds_total|node_disk_write_time_seconds_total|node_network_transmit_packets_total|node_network_receive_packets_total|node_network_transmit_drop_total|node_network_receive_drop_total|kube_replicaset_owner|kube_deployment_created|kube_deployment_status_condition|kube_deployment_spec_replicas|kube_namespace_status_phase|kubelet_volume_stats_inodes|kubelet_volume_stats_inodes_used|kubelet_volume_stats_used_bytes|kube_persistentvolumeclaim_info|kube_persistentvolumeclaim_resource_requests_storage_bytes|kube_job_owner|kube_pod_container_info|container_cpu_cfs_throttled_seconds_total|kube_daemonset_status_observed_generation|kube_deployment_status_observed_generation|kube_statefulset_status_observed_generation|kube_statefulset_metadata_generation|kube_deployment_metadata_generation|kube_daemonset_metadata_generation
        custom: 
      drop:
        custom: 
    # for applications pipeline: applications job
    applications:
      keep:
        custom:
      drop:
        custom: 
  
  # Namespaces names to be filtered
  # All values should be listed with | seperator, as regex. i.e: namespace_1|namespace_2|namespace_3
  namespaces:
    # for infrastructure pipeline: metrics/infrastructure & metrics/cadvisor receivers
    # (kubernetes-service-endpoints & cadvisor jobs)
    infrastructure:
      keep:
        custom:
      drop:
        kubeSystem: kube-system # need to also enable the flag: enableMetricsFilter.kubeSystem=true
        custom:
    # for applications pipeline: applications job
    applications:
      keep:
        custom:
      drop:
        custom:
  
  # Services names to filtered
  # All values should be listed with | seperator, as regex. i.e: service_1|service_2|service_3
  services:
    # for infrastructure pipeline: metrics/infrastructure & metrics/cadvisor receivers
    # (kubernetes-service-endpoints & cadvisor jobs)
    infrastructure:
      keep:
        custom: 
      drop:
        kubeDns: kube-dns # need to also enable the flag: disableKubeDnsScraping=true
        custom:
