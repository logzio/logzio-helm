# Default values for logzio-telemetry.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

collector:
  mode: daemonset # possible values: standalone, daemonset
metrics:
  enabled: false # Send metrics telemetry 

applicationMetrics:
  ## Send application metrics, requires `metrics.enabled` and the `prometheus.io/scrape: true` annotation set.
  enabled: false 
kubeStateMetrics:
  ## If false, kube-state-metrics sub-chart will not be installed
  enabled: true
pushGateway:
  ## If false, prometheus-push-gateway sub-chart will not be installed
  enabled: true
nodeExporter:
  ## If false, prometheus-node-exporter will not be installed
  enabled: true

nameOverride: "otel-collector" # The resources name prefix 
fullnameOverride: "" # The resources name

global:
  # Metrics account shipping token
  logzioMetricsToken: ""
  # Kubernetes objects Logs account shipping token
  logzioLogsToken: ""
  # Environment name 
  env_id: "my_environment"
  # Listener address region code - https://docs.logz.io/docs/user-guide/admin/hosting-regions/account-region/
  logzioRegion: "us"
  # Custom Metrics endpoint, overrides global.LogzioRegion listener address
  customMetricsEndpoint: ""
  # Custom Logs endpoint, overrides global.LogzioRegion listener address
  customLogsEndpoint: ""
  # Optional - Identifier for the Kubernetes distribution used. One of "eks", "aks" or "gke".
  distribution: ""
  # Optional - Control enabling of the OpenTelemetry Collector's resource detection feature. Dependent on `distribution` value.
  resourceDetection:
    enabled: false
  # Windows Support - These settings enable deployment of collectors on Windows nodes
  windows:
    # Set to true to deploy an additional collector on Windows nodes
    enabled: false
    # Windows Server version: "2019" or "2022" (must match your Windows node OS version)
    version: "2022"

secrets:
  name: logzio-secret  # Secret name
  enabled: true  # Create secret

# ---
# Filters for Prometheus metrics (infrastructure/applications pipelines)
# 
# NEW SYNTAX (Recommended):
# Use this simpler, more flexible syntax for new deployments:
# filters:
#   infrastructure:
#     exclude:
#       namespace: "kube-system"
#       attribute:
#         deployment.environment: "dev|test"
#   applications:
#     exclude:
#       name: "go_gc_duration_seconds"
#     include:
#       namespace: "prod"
#       attribute:
#         http.status_code: "5*"
#
# LEGACY SYNTAX (Backward Compatibility):
# The prometheusFilters section below is maintained for existing customers.
# For new deployments, prefer the new filters syntax above.
#
# All filter values are regular expressions.
# See README.md for full syntax and mapping.
filters: {}

enableServiceLinks: true

managedServiceAccount: true 

clusterRole:
  # Specifies whether a clusterRole should be created
  create: false
  # Annotations to add to the clusterRole
  annotations: {}
  # The name of the clusterRole to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # A set of rules as documented here : https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  rules: []
  # - apiGroups:
  #   - ''
  #   resources:
  #   - 'pods'
  #   - 'nodes'
  #   verbs:
  #   - 'get'
  #   - 'list'
  #   - 'watch'
  clusterRoleBinding:
    # Annotations to add to the clusterRoleBinding
    annotations: {}
    # The name of the clusterRoleBinding to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

clusterRoleRules:
- apiGroups:
  - ""
  resources:
  - events
  - namespaces
  - namespaces/status
  - nodes
  - nodes/spec
  - nodes/proxy
  - pods
  - pods/metrics
  - nodes/metrics
  - pods/status
  - replicationcontrollers
  - replicationcontrollers/status
  - resourcequotas
  - services
  - endpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions
  resources:
  - daemonsets
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch

prometheus-pushgateway:
  serviceAnnotations:
    prometheus.io/scrape: "true"
  nodeSelector:
    kubernetes.io/os: linux
# Configuration merge from the collector configs
emptyConfig: {}
# Base configuration of the collector
baseCollectorConfig:
  extensions:
    health_check:
      endpoint: :13133
  processors:
    batch: {}
    attributes/env_id:
      actions:
        - key: env_id
          value: ${ENV_ID}
          action: insert
        - key: logzio_agent_version
          value: ${LOGZIO_AGENT_VERSION}
          action: insert
  service:
    extensions:
      - health_check
    telemetry:
      logs:
        level: "info"
# Metrics standalone collector configuration 
metricsConfig:
  extensions:
    health_check:
      endpoint: :13133
  processors:
    filter/kubernetes360:
      metrics:
        datapoint:
          - 'IsMatch(metric.name, "(${K8S_360_METRICS})") == true and attributes["logzio_app"] != "kubernetes360"'
    batch: {}
  exporters:
    prometheusremotewrite/applications:
      disable_scope_info: true  # don't add otel_scope_* labels to every series
      timeout: 30s
      endpoint: ${LISTENER_URL}
      external_labels:
        p8s_logzio_name: ${ENV_ID}
      headers:
        Authorization: "Bearer ${METRICS_TOKEN}"
        user-agent: "{{ .Chart.Name }}-{{ .Chart.Version }}-helm"
    prometheusremotewrite/infrastructure:
      disable_scope_info: true  # don't add otel_scope_* labels to every series
      timeout: 30s
      endpoint: ${LISTENER_URL}
      external_labels:
        p8s_logzio_name: ${ENV_ID}
      headers:
        Authorization: "Bearer ${METRICS_TOKEN}"
        user-agent: "{{ .Chart.Name }}-{{ .Chart.Version }}-helm"
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
    prometheus/applications:
      config:
        global:
          scrape_interval: 60s
          scrape_timeout: 60s
        scrape_configs:
        - job_name: applications
          honor_timestamps: true
          honor_labels: true
          metrics_path: /metrics
          scheme: http
          kubernetes_sd_configs:
          - role: pod
          relabel_configs:
            - action: keep
              regex: true|"true"
              source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            - action: replace
              regex: (https?)
              source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
              target_label: __scheme__
            - action: replace
              regex: (.+)
              source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              target_label: __metrics_path__
            - action: replace
              regex: (.+?)(?::\d+)?;(\d+)
              replacement: $$1:$$2
              source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
              replacement: __param_$$1
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - action: replace
              source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - action: replace
              source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - source_labels: [__meta_kubernetes_pod_node_name]
              action: replace
              target_label: kubernetes_node          
          metric_relabel_configs: []
    prometheus/kubelet:
      config:
        global:
          scrape_interval: 30s
          scrape_timeout: 30s
        scrape_configs:
        - authorization:
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            type: Bearer
          job_name: kubernetes-nodes
          kubernetes_sd_configs:
          - role: node
          metric_relabel_configs: []
          relabel_configs:
          - replacement: kubernetes.default.svc:443
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)        
          - regex: (.+)            
            replacement: /api/v1/nodes/$${1}/proxy/metrics
            source_labels:
            - __meta_kubernetes_node_name
            target_label: __metrics_path__
          - action: replace
            replacement: kubernetes360
            target_label: logzio_app
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true
    prometheus/cadvisor:
      config:
        global:
          scrape_interval: 30s
          scrape_timeout: 30s
        scrape_configs:
        - job_name: 'kubernetes-cadvisor'
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true
          authorization:
            type: Bearer
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
          - role: node
          relabel_configs:
          - source_labels: [__meta_kubernetes_node_label_kubernetes_io_os]
            regex: windows
            action: drop
          - replacement: kubernetes.default.svc:443
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor
          - action: replace
            replacement: kubernetes360
            target_label: logzio_app
          metric_relabel_configs: []
    prometheus/collector:
      config:
        global:
          scrape_interval: 30s
          scrape_timeout: 30s
        scrape_configs:
        # Job to collect opentelemetry collector metrics
        - job_name: 'collector-metrics'
          scrape_interval: 15s
          static_configs:
          - targets: [ "0.0.0.0:8888" ]
    prometheus/infrastructure:
      config:
        global:
          scrape_interval: 30s
          scrape_timeout: 30s
        scrape_configs:
        - job_name: windows-metrics
          honor_timestamps: true
          honor_labels: true
          metrics_path: /metrics
          scheme: http
          kubernetes_sd_configs:
          - role: node
          relabel_configs:
            - source_labels: [__meta_kubernetes_node_label_kubernetes_io_os]
              regex: windows
              action: keep
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - source_labels: [__meta_kubernetes_node_name]
              action: replace
              target_label: kubernetes_node
            - source_labels: [__address__]
              regex: '(.+):\d+'
              replacement: '$${1}:9182'
              target_label: __address__
            - action: replace
              replacement: kubernetes360
              target_label: logzio_app
          metric_relabel_configs: []
        - job_name: kubernetes-service-endpoints
          honor_timestamps: true
          honor_labels: true
          metrics_path: /metrics
          scheme: http
          kubernetes_sd_configs:
          - role: endpoints
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
              action: keep
              regex: true|"true"
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
              action: replace
              target_label: __scheme__
              regex: (https?)
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
              action: replace
              target_label: __address__
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $$1:$$2
            - action: labelmap
              regex: __meta_kubernetes_service_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
            - source_labels: [__meta_kubernetes_service_name]
              action: replace
              target_label: service
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
            - source_labels: [__meta_kubernetes_pod_node_name]
              action: replace
              target_label: kubernetes_node
            - source_labels: [__meta_kubernetes_service_annotation_logz_io_app]
              action: replace
              target_label: logzio_app                 
          metric_relabel_configs: []
  service:
    extensions:
      - health_check
    pipelines:
      metrics/infrastructure:
        exporters:
          - prometheusremotewrite/infrastructure
        processors:
          - attributes/env_id
          - filter/kubernetes360
          - batch
        receivers:
          - prometheus/infrastructure
          - prometheus/cadvisor
          - prometheus/kubelet
          - prometheus/collector
          - otlp
          
# Shared params for daemonsetCollector and standaloneCollector deployment pods.
# Can be overridden here or for any component independently using the same keys.

image:
  # If you want to use the contrib image `otel/opentelemetry-collector-contrib`, you also need to change `command.name` value to `otelcontribcol`.
  repository: otel/opentelemetry-collector-contrib
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
# windows_exporter, deployed as a HostProcess DaemonSet on Windows nodes.
# Requires Kubernetes >= 1.26 (HostProcess GA) and a containerd runtime.
windowsExporter:
  image:
    # Upstream prometheus-community windows_exporter HostProcess image
    repository: ghcr.io/prometheus-community/windows-exporter
    pullPolicy: IfNotPresent
    # Pin an explicit version so exported metric names stay deterministic
    tag: "0.31.8"
  # Port the exporter listens on and that the collector scrapes (node InternalIP:port)
  port: 9182
  # Comma-separated list of collectors to enable
  collectors: "cpu,cpu_info,container,logical_disk,memory,net,os,service,system,tcp"
  resources: {}
imagePullSecrets: []

# OpenTelemetry Collector executable
command:
  name: otelcol-contrib
  extraArgs: 

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podSecurityContext: {}
securityContext: {}
containerSecurityContext: {}

nodeSelector: {}
linuxNodeSelector: {
  "kubernetes.io/os": linux
}

tolerations: []

affinity: {}

## Topology spread constraints for pod assignment
## Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
topologySpreadConstraints: []

# Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
podDisruptionBudget:
  enabled: false
# Set the minimum available replicas
#  minAvailable: 1
# OR Set the maximum unavailable replicas
#  maxUnavailable: 1
# If both defined only maxUnavailable will be used

extraEnvs: []
extraConfigMapMounts: []
extraHostPathMounts: []
secretMounts: []

# PriorityClass name for the collector pods
priorityClassName: ""

# Configuration for ports, shared between daemonsetCollector, standaloneCollector and service.
# Can be overridden here or for daemonsetCollector and standaloneCollector independently.
ports:
  health-check:
    enabled: true
    containerPort: 13133
    servicePort: 13133
    hostPort: 13133
    protocol: TCP
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: 4318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    hostPort: 8888
    protocol: TCP
  carbon:
    enabled: false
    containerPort: 2003
    servicePort: 2003
    hostPort: 2003
    protocol: TCP

# Carbon config
carbon:
  enabled: false
  config:
    receivers:
      # Carbon receiver to accept metrics from Carbon/Graphite client libraries # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/carbonreceiver/README.md
      carbon:
        endpoint: "0.0.0.0:2003"
        transport: tcp
    processors:
      # Batch processor to improve performance by grouping metrics
      batch/carbon: {}
    exporters:
      # Prometheus Remote Write exporter for Logz.io
      prometheusremotewrite/carbon:
        disable_scope_info: true  # don't add otel_scope_* labels to every series
        endpoint: "${LISTENER_URL}"
        headers:
          Authorization: "Bearer ${METRICS_TOKEN}"
          user-agent: '{{ .Chart.Name }}-{{ .Chart.Version }}-helm'          
        external_labels:
          p8s_logzio_name: ${ENV_ID}

    service:
      pipelines:
        metrics/carbon:
          receivers: [carbon]
          processors: [batch/carbon]
          exporters: [prometheusremotewrite/carbon]

# Kubernetes Object logs
k8sObjectsConfig:
  enabled: false
  # Resources for the single-replica k8s objects collector deployment
  resources:
    requests:
      cpu: 50m
      memory: 70Mi
  config:
    receivers:
      # Watch for changes in Kubernetes objects
      k8sobjects/watch:
        objects:
          - name: pods
            mode: watch
            exclude_watch_type: [ DELETED, BOOKMARK ]
          - name: deployments
            mode: watch
            exclude_watch_type: [ DELETED, BOOKMARK ]
          - name: daemonsets
            mode: watch
            exclude_watch_type: [ DELETED, BOOKMARK ]
          - name: statefulsets
            mode: watch
            exclude_watch_type: [ DELETED, BOOKMARK ]
          - name: jobs
            mode: watch
            exclude_watch_type: [ DELETED, BOOKMARK ]
          - name: nodes
            mode: watch
            exclude_watch_type: [ DELETED, BOOKMARK ]
      # Pull Kubernetes objects every 3 hours(default)
      k8sobjects/pull:
        objects:
          - name: pods
            mode: pull
            interval: 180m
          - name: deployments
            mode: pull
            interval: 180m
          - name: daemonsets
            mode: pull
            interval: 180m
          - name: statefulsets
            mode: pull
            interval: 180m
          - name: jobs
            mode: pull
            interval: 180m
          - name: nodes
            mode: pull
            interval: 180m
    processors:
      # Adds eventType key with value of type key, then sets type to k8s_object
      transform/log_type:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(body["eventType"],body["type"]) where body["type"] != "k8s_object"
              - set(body["type"], "k8s_object")
      resource/env_id:
        attributes:
        # Adds env_id key with value from the secret
        - key: env_id
          action: insert
          value: ${ENV_ID}
      # For pulled objects, copy the log into object key       
      transform/pulled_object:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(body["object"],body) where body["object"] == nil
              - keep_keys(body, ["object", "type", "eventType"])
      # Remove managed fields metadata key              
      transform/remove_managedfields:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - delete_key(body["object"]["metadata"], "managedFields")
      # Don't add the k8sobjects receiver scope name and version to every object log
      transform/remove_scope:
        error_mode: ignore
        log_statements:
          - context: scope
            statements:
              - set(scope.name, "")
              - set(scope.version, "")
      batch/k8sobjects: {}
    exporters:
      logzio/object_logs:
        account_token: "${OBJECTS_LOGS_TOKEN}"
        region: "${LOGZIO_LISTENER_REGION}"
        endpoint: "${CUSTOM_LOGS_ENDPOINT}"
        headers:
          user-agent: "{{ .Chart.Name }}-{{ .Chart.Version }}-helm"
    service:
      pipelines:
        logs/k8sobjects:
          receivers: [k8sobjects/pull,k8sobjects/watch]
          processors: [transform/pulled_object,transform/remove_managedfields,transform/log_type,transform/remove_scope, resource/env_id, batch/k8sobjects]
          exporters: [logzio/object_logs]
# Configuration for standalone OpenTelemetry Collector deployment, enabled by default
standaloneCollector:
  enabled: false

  containerLogs:
    enabled: false

  resources: {}
   ## Resources are not specified by default, to ensure the chart runs on environments with little resources.
   ## If you want to specify resources, uncomment the following  lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # requests:
    #   cpu: 200m
    #   memory: 512Mi
    # limits:
    #   cpu: 500m
    #   memory: 1024Mi
  podLabels:  {}

  podAnnotations: {}
  
  # Configuration override that will be merged into the collector default config
  configOverride: {}

  replicaCount: 1
  
daemonsetCollector:
  enabled: false

  containerLogs:
    enabled: false
  
  # prevent collector daemonset deployment on fargate nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: eks.amazonaws.com/compute-type
                operator: DoesNotExist


  resources: {}
   ## Resources are not specified by default, to ensure the chart runs on environments with little resources.
   ## If you want to specify resources, uncomment the following  lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # requests:
    #   cpu: 150m
    #   memory: 256Mi
    # limits:
    #   cpu: 300m
    #   memory: 512Mi
  podLabels:  {}

  podAnnotations: {}
  
  # Configuration override that will be merged into the daemonset default config
  configOverride: {}

# liveness probe configuration
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
##
livenessProbe:
  # Number of seconds after the container has started before startup, liveness or readiness probes are initiated.
  # initialDelaySeconds: 1
  # How often in seconds to perform the probe.
  # periodSeconds: 10
  # Number of seconds after which the probe times out.
  # timeoutSeconds: 1
  # Minimum consecutive failures for the probe to be considered failed after having succeeded.
  # failureThreshold: 1
  # Duration in seconds the pod needs to terminate gracefully upon probe failure.
  # terminationGracePeriodSeconds: 10
  httpGet:
    port: 13133
    path: /
    # Set host for health check probes (e.g., "localhost" for GKE environments)
    # host: localhost

# readiness probe configuration
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
##
readinessProbe:
  # Number of seconds after the container has started before startup, liveness or readiness probes are initiated.
  # initialDelaySeconds: 1
  # How often (in seconds) to perform the probe.
  # periodSeconds: 10
  # Number of seconds after which the probe times out.
  # timeoutSeconds: 1
  # Minimum consecutive successes for the probe to be considered successful after having failed.
  # successThreshold: 1
  # Minimum consecutive failures for the probe to be considered failed after having succeeded.
  # failureThreshold: 1
  httpGet:
    port: 13133
    path: /
    # Set host for health check probes (e.g., "localhost" for GKE environments)
    # host: localhost

service:
  type: ClusterIP
  clusterIP: ""
  annotations: {}

# autoscaling is used only if standaloneCollector enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podLabels:  {}
annotations:  {}

kube-state-metrics:
  service:
    annotations:
      logz.io/app: "kubernetes360"
  nodeSelector:
    kubernetes.io/os: linux
  podSecurityPolicy:
    enabled: false
  extraArgs: ["--metric-labels-allowlist=nodes=[kubernetes.azure.com/scalesetpriority,eks.amazonaws.com/capacityType,cloud.google.com/gke-preemptible]"]

prometheus-node-exporter:
  service:
    port: 9101
    targetPort: 9101
    annotations:
      prometheus.io/scrape: "true"
      logz.io/app: "kubernetes360"
  nodeSelector:
    kubernetes.io/os: linux
  # Prevent node exporter deamonset deploymment on fargate nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: eks.amazonaws.com/compute-type
                operator: DoesNotExist
  rbac:
    pspEnabled: false
# Filter only metrics relevant for prebuilt content
enableMetricsFilter:
  gke: false  # Google Kubernetes Engine
  eks: false  # Amazon Elastic Kubernetes Service
  aks: false  # Azure Kubernetes Service
  dropKubeSystem: false  # Drop kube-system metrics

disableKubeDnsScraping: false  # Kube DNS metrics scraping

# Metrics Daemonset collector configuration
daemonsetConfig:
  extensions:
    health_check:
      endpoint: :13133
  processors:
    filter/kubernetes360:
      metrics:
        datapoint:
          - 'IsMatch(metric.name, "(${K8S_360_METRICS})") == true and attributes["logzio_app"] != "kubernetes360"'
          # Workaround for an issue where metrics are scraped multiple times
          - 'attributes["job_dummy"] == "kubernetes-service-endpoints" and attributes["kubernetes_node"] == nil'
    # Removes label needed for duplicate metrics checks
    attributes/remove_job_dummy:
      actions:
        - key: job_dummy
          action: delete
    batch: {}
  exporters:
    prometheusremotewrite/applications:
      disable_scope_info: true  # don't add otel_scope_* labels to every series
      timeout: 30s
      endpoint: ${LISTENER_URL}
      external_labels:
        p8s_logzio_name: ${ENV_ID}
      headers:
        Authorization: "Bearer ${METRICS_TOKEN}"
        user-agent: "{{ .Chart.Name }}-{{ .Chart.Version }}-helm"
    prometheusremotewrite/infrastructure:
      disable_scope_info: true  # don't add otel_scope_* labels to every series
      timeout: 30s
      endpoint: ${LISTENER_URL}
      external_labels:
        p8s_logzio_name: ${ENV_ID}
      headers:
        Authorization: "Bearer ${METRICS_TOKEN}"
        user-agent: "{{ .Chart.Name }}-{{ .Chart.Version }}-helm"
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
    prometheus/applications:
      config:
        global:
          scrape_interval: 30s
          scrape_timeout: 30s
        scrape_configs:
        - job_name: applications
          honor_timestamps: true
          honor_labels: true
          metrics_path: /metrics
          scheme: http
          kubernetes_sd_configs:
          - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_node_name]
              regex: '${KUBE_NODE_NAME}'
              action: keep
            - action: keep
              regex: true|"true"
              source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            - action: replace
              regex: (https?)
              source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
              target_label: __scheme__
            - action: replace
              regex: (.+)
              source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              target_label: __metrics_path__
            - action: replace
              regex: (.+?)(?::\d+)?;(\d+)
              replacement: $$1:$$2
              source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
              replacement: __param_$$1
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - action: replace
              source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - action: replace
              source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - source_labels: [__meta_kubernetes_pod_node_name]
              action: replace
              target_label: kubernetes_node          
          metric_relabel_configs: []
    prometheus/kubelet:
      config:
        global:
          scrape_interval: 30s
          scrape_timeout: 30s
        scrape_configs:
        - authorization:
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            type: Bearer
          job_name: kubernetes-nodes
          kubernetes_sd_configs:
          - role: node
            selectors:
            - field: metadata.name=${KUBE_NODE_NAME}
              role: node
          metric_relabel_configs: []
          relabel_configs:
          - replacement: kubernetes.default.svc:443
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)         
          - regex: (.+)            
            replacement: /api/v1/nodes/$${1}/proxy/metrics
            source_labels:
            - __meta_kubernetes_node_name
            target_label: __metrics_path__
          - action: replace
            replacement: kubernetes360
            target_label: logzio_app
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true
    prometheus/cadvisor:
      config:
        global:
          scrape_interval: 30s
          scrape_timeout: 30s
        scrape_configs:
        - job_name: 'kubernetes-cadvisor'
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true
          authorization:
            type: Bearer
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
          - role: node
            selectors:
            # only scrape the node the collector runs on
            - field: metadata.name=${KUBE_NODE_NAME}
              role: node
          relabel_configs:
          - source_labels: [__meta_kubernetes_node_label_kubernetes_io_os]
            regex: windows
            action: drop
          - replacement: kubernetes.default.svc:443
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor
          - action: replace
            replacement: kubernetes360
            target_label: logzio_app
          metric_relabel_configs: []
    prometheus/collector:
      config:
        global:
          scrape_interval: 30s
          scrape_timeout: 30s
        scrape_configs:
        # Job to collect opentelemetry collector metrics
        - job_name: 'collector-metrics'
          scrape_interval: 15s
          static_configs:
          - targets: [ "0.0.0.0:8888" ] 
          metric_relabel_configs: []
    prometheus/infrastructure:
      config:
        global:
          scrape_interval: 30s
          scrape_timeout: 30s
        scrape_configs:
        - job_name: windows-metrics
          honor_timestamps: true
          honor_labels: true
          metrics_path: /metrics
          scheme: http
          kubernetes_sd_configs:
          - role: node
            selectors:
            - field: metadata.name=${KUBE_NODE_NAME}
              role: node
          relabel_configs:
            - source_labels: [__meta_kubernetes_node_label_kubernetes_io_os]
              regex: windows
              action: keep
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - source_labels: [__meta_kubernetes_node_name]
              action: replace
              target_label: kubernetes_node
            - source_labels: [__address__]
              regex: '(.+):\d+'
              replacement: '$${1}:9182'
              target_label: __address__
            - action: replace
              replacement: kubernetes360
              target_label: logzio_app
          metric_relabel_configs: []
        # Job to collect metrics from applications running on pods
        - job_name: kubernetes-service-endpoints
          honor_timestamps: true
          honor_labels: true
          metrics_path: /metrics
          scheme: http
          kubernetes_sd_configs:
          - role: endpoints
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_node_name]
              regex: '${KUBE_NODE_NAME}'
              action: keep
            # Adding a dummy job label to enable filtering for duplicate metrics using daemonset collector
            # "job" label is only added in the prometheusremotewrite and cannot be added before
            - action: replace
              replacement: kubernetes-service-endpoints
              target_label: job_dummy
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
              action: keep
              regex: true|"true"
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
              action: replace
              target_label: __scheme__
              regex: (https?)
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
              action: replace
              target_label: __address__
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $$1:$$2
            - action: labelmap
              regex: __meta_kubernetes_service_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
            - source_labels: [__meta_kubernetes_service_name]
              action: replace
              target_label: service
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
            - source_labels: [__meta_kubernetes_pod_node_name]
              action: replace
              target_label: kubernetes_node
            - source_labels: [__meta_kubernetes_service_annotation_logz_io_app]
              action: replace
              target_label: logzio_app                 
          metric_relabel_configs: []
  service:
    extensions:
      - health_check
    pipelines:
      metrics/infrastructure:
        exporters:
          - prometheusremotewrite/infrastructure
        processors:
          - attributes/env_id
          - filter/kubernetes360
          # workaround for duplicate metrics sent from kubernetes-service-endpoints job
          - attributes/remove_job_dummy
          - batch
        receivers:
          - prometheus/infrastructure
          - prometheus/cadvisor
          - prometheus/kubelet
          - prometheus/collector
          - otlp
    telemetry:
      logs:
        level: "info" 

         
opencost:
  enabled: false
  config:
    processors:
    # opencost collects duplicates metrics from kube-state and cadvisor.
      filter/opencost-exporter: 
        metrics:
          datapoint:     
            - 'IsMatch(metric.name, "(${OPENCOST_DUPLICATES})") == true and attributes["app"] == "opencost"'
    service:
      pipelines:
        metrics/infrastructure:
          processors:
            - filter/opencost-exporter

# ---
# PROMETHEUS FILTERS (Backward Compatibility)
# This section is maintained for existing customers using the prometheusFilters syntax.
# For new deployments, prefer the new 'filters' syntax above.
# 
# The prometheusFilters section provides complex filtering capabilities for:
# - Metrics filtering (keep/drop) with cloud provider presets (aks/eks/gke)
# - Namespace filtering with kube-system exclusion
# - Service filtering with kube-dns exclusion
