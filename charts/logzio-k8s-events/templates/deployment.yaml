apiVersion: {{ .Values.apiVersions.deployment }}
kind: Deployment
metadata:
  name: {{.Values.k8sApp}}
  namespace: {{ .Release.Namespace }} 
  labels:
    k8s-app: {{ .Values.k8sApp }}
    {{- include "logzio-k8s-events.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: {{ .Values.k8sApp }}
      {{- include "logzio-k8s-events.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        k8s-app: {{ .Values.k8sApp }}
        {{- include "logzio-k8s-events.selectorLabels" . | nindent 8 }}
    spec:
      {{- if or .Values.tolerations .Values.global.tolerations }}
      {{- $allTolerations := concat (.Values.tolerations | default list) (.Values.global.tolerations | default list) }}
      tolerations:
{{ toYaml $allTolerations | nindent 8 }}
      {{- end }}
      {{ with (include "logzio-k8s-events.nodeSelector" .) }}{{ . | nindent 6 }}{{ end }}
      {{ with (include "logzio-k8s-events.affinity" .) }}{{ . | nindent 6 }}{{ end }}
      {{- if .Values.isRBAC }}
      serviceAccountName: {{ template "logzio-k8s-events.serviceAccountName" . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Values.k8sApp }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        {{- $debug := eq (toString .Values.debug) "true" }}
        {{- $hashKeySecret := .Values.maskingHashKeySecret | default dict }}
        {{- if (or .Values.secret.name .Values.envVars $debug .Values.sensitiveEnvNames $hashKeySecret.name) }}
          env:
          {{- range .Values.envVars }}
            - name: {{ .name | quote }}
            {{- if and (hasKey . "value") (not (kindIs "invalid" .value)) }}
            {{- $value := .value }}
            {{- /* YAML numbers arrive as floats, which toString would print as 1e+06 */}}
            {{- if and (kindIs "float64" $value) (eq $value (float64 (int64 $value))) }}
            {{- $value = int64 $value }}
            {{- end }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
            {{- if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
            {{- end }}
          {{- end }}
          {{- if $debug }}
            - name: DEBUG
              value: "true"
          {{- end }}
          {{- with .Values.sensitiveEnvNames }}
            - name: SENSITIVE_ENV_NAMES
              value: {{ . | quote }}
          {{- end }}
          {{- with $hashKeySecret.name }}
            - name: MASKING_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $hashKeySecret.key | default "masking-hash-key" | quote }}
          {{- end }}
          {{- if .Values.secret.name }}
            - name: LOGZIO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{.Values.secret.name}}
                  key: logzio-log-shipping-token
            - name: LOGZIO_LISTENER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: logzio-log-listener
            - name: ENV_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: env-id     
          {{- end }}
        {{- end }}
        {{$resources := .Values.resources }}
        {{- with $resources }}
          resources:
            {{- toYaml . | nindent 12 }}
        {{- end}}