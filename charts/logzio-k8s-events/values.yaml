# Default values for logzio-k8s-events.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


image:
  repository: logzio/logzio-k8s-events
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.0.0"

k8sApp: logzio-k8s-events

apiVersions:
  deployment: apps/v1
  serviceAccount: v1
  clusterRole: rbac.authorization.k8s.io/v1
  clusterRoleBinding: rbac.authorization.k8s.io/v1
  configmap: v1
  secret: v1

nameOverride: ""
fullnameOverride: ""

global:
  logzioLogsToken: ""
  logzioRegion: "" # Defaults to us
  env_id: ""
  customLogsEndpoint: "" # Overrides Logz.io listener
  tolerations: []

isRBAC: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

tolerations: []
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/arch
          operator: In
          values: 
            - arm64
            - amd64
nodeSelector: {}

resources:
  requests:
    cpu: 100m
    memory: 200Mi
terminationGracePeriodSeconds: 30

# Print each full event to the container's stdout. By default only a one-line summary is printed
debug: false

# Regex of additional env var names whose values are hashed, e.g. "internal_id|^ssn$".
# It extends the built-in pattern (password, secret, token, api_key, ...)
sensitiveEnvNames: ""

# Secret holding the key for hashing sensitive values. Set it to keep hashes comparable across restarts,
# otherwise a random key is used on each container start
maskingHashKeySecret:
  name: ""
  # The entry in that Secret holding the hash key. Only used if maskingHashKeySecret.name is set
  key: masking-hash-key

# Extra environment variables for the container. Each item takes a `name` and either a `value` or a `valueFrom`
envVars: []

secret:
  enabled: true
  name: logzio-k8s-events-secret

clusterRole:
  rules:
    - apiGroups:
        - ""
        - "rbac.authorization.k8s.io"
        - "apps"
      resources:
        - pods
        - deployments
        - daemonsets
        - statefulsets
        - clusterroles
        - clusterrolebindings
        - configmaps
        - secrets
        - serviceaccounts
      verbs:
        - get
        - list
        - watch
