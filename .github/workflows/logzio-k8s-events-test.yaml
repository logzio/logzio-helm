name: Test `logzio-k8s-events` chart
on:
  pull_request:
    branches:
      - master
    paths:
      - 'charts/logzio-k8s-events/Chart.yaml'
      - 'charts/logzio-k8s-events/templates/**'
      - 'charts/logzio-k8s-events/values.yaml'
      - '.github/workflows/logzio-k8s-events-test.yaml'
      - 'tests/k8s_events_logs_e2e_test.go'
      - 'tests/resources/k8s-events-workload.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Generate random id
        id: random_id
        run: echo "rand=$(echo $RANDOM)" >> $GITHUB_OUTPUT

      - name: Set ENV_ID
        run: echo "ENV_ID=k8s-events-test-run-${{ steps.random_id.outputs.rand }}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/v0.33.0/kind-Linux-amd64"
          chmod +x ./kind
          mv ./kind /usr/local/bin/kind

      - name: Create Kind cluster
        run: |
          kind create cluster --name kind-${{ github.run_id }}
          kubectl cluster-info

      - name: Deploy K8S Events Helm Chart
        run: |
          kubectl create secret generic k8s-events-hash-key --from-literal=masking-hash-key="$(openssl rand -hex 32)"
          cd charts/logzio-k8s-events
          helm upgrade --install \
          --set global.env_id=${{ env.ENV_ID }} \
          --set global.tolerations[0].key="global-key" \
          --set global.tolerations[0].operator="Equal" \
          --set global.tolerations[0].value="global-value" \
          --set global.tolerations[0].effect="NoSchedule" \
          --set global.logzioLogsToken=${{ secrets.LOGZIO_LOGS_TOKEN }} \
          --set global.logzioRegion=us \
          --set debug=true \
          --set sensitiveEnvNames='internal_id' \
          --set maskingHashKeySecret.name=k8s-events-hash-key \
          --set envVars[0].name=EXTRA_BOOL \
          --set envVars[0].value=true \
          --set envVars[1].name=POD_NAME \
          --set envVars[1].valueFrom.fieldRef.fieldPath=metadata.name \
          logzio-k8s-events .

      - name: Verify deployment Status
        run: |
          kubectl rollout status deployment/logzio-k8s-events --timeout=300s
          kubectl get deployment logzio-k8s-events -o json | jq '.status.numberReady == .status.desiredNumberScheduled'
          kubectl get deployment logzio-k8s-events -o jsonpath='{.spec.template.spec.tolerations}' | grep -q 'global-key'
          kubectl get deployment logzio-k8s-events -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="DEBUG")].value}' | grep -qx 'true'
          kubectl get deployment logzio-k8s-events -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="SENSITIVE_ENV_NAMES")].value}' | grep -qx 'internal_id'
          kubectl get deployment logzio-k8s-events -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="MASKING_HASH_KEY")].valueFrom.secretKeyRef.name}' | grep -qx 'k8s-events-hash-key'
          kubectl get deployment logzio-k8s-events -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="EXTRA_BOOL")].value}' | grep -qx 'true'
          kubectl get deployment logzio-k8s-events -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="POD_NAME")].valueFrom.fieldRef.fieldPath}' | grep -qx 'metadata.name'

      - name: Create and update test resources
        run: |
          # Events from before the informers sync are ignored
          sleep 20
          kubectl apply -f tests/resources/k8s-events-workload.yaml
          sleep 5
          kubectl -n k8s-events-e2e patch secret db --type merge -p '{"stringData":{"value":"E2E-MARKER-DATA-CHANGED"}}'
          kubectl -n k8s-events-e2e set env deployment/app NEW_VAR=1

      - name: Run k8s events logs test
        env:
          LOGZIO_LOGS_API_KEY: ${{ secrets.LOGZIO_LOGS_API_KEY }}
        run: go test -v ./tests/k8s_events_logs_e2e_test.go ./tests/common.go

      - name: Cleanup Environment
        if: always()
        run: |
          kind delete cluster --name kind-${{ github.run_id }}